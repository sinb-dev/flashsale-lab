services:
  sql:
    build: ./sql
    image: flashsale/sql:1.0
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FlashSale_2026!"
      MSSQL_PID: "Developer"
    volumes:
      - sqldata:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -h -1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./api
    image: flashsale/api:1.0
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Sale: "Server=sql;Database=sale;User Id=sa;Password=FlashSale_2026!;TrustServerCertificate=true;Max Pool Size=8"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sqldata:
